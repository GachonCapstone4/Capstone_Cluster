apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  namespace: maily
data:
  RABBITMQ_HOST: "rabbitmq-headless.rabbitmq"
  RABBITMQ_PORT: "5672"
  DB_HOST: "mariadb-0.mariadb-headless.database.svc.cluster.local"   # 쓰기 가능한 primary 고정 (mariadb-1은 read-only 복제본)
  DB_PORT: "3306"
  APP_FRONTEND_BASE_URL: "https://capstone.studylink.click"
  APP_FRONTEND_ALLOWED_ORIGINS: "https://capstone.studylink.click, maily://app"
  GOOGLE_REDIRECT_URI: "https://capstone.studylink.click/api/integrations/google/callback"
  S3_PREFIX: "rag/client"
