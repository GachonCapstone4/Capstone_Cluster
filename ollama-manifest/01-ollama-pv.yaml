# 01-ollama-pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-pv
spec:
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   # 모델 캐시 보존 (재다운로드 방지)
  storageClassName: ""
  nfs:
    server: 192.168.2.40
    path: /srv/nfs/share/ollama
  claimRef:
    name: ollama-data-pvc
    namespace: ai-infra
