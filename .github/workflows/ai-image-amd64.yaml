name: Build AI inference image (amd64)

# AI 레포를 수정하지 않고 클러스터용 amd64 이미지를 빌드한다.
# 필요한 레포 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
on:
  workflow_dispatch:
    inputs:
      ai_ref:
        description: "GachonCapstone4/AI 브랜치/태그/커밋"
        required: true
        default: main

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cluster repo (Dockerfile.amd64)
        uses: actions/checkout@v4

      - name: Checkout AI repo (build context)
        uses: actions/checkout@v4
        with:
          repository: GachonCapstone4/AI
          ref: ${{ inputs.ai_ref }}
          path: ai-src

      - name: Resolve image tag
        id: meta
        run: echo "tag=amd64-$(git -C ai-src rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ai-src
          file: ./ai-manifest/build/Dockerfile.amd64
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: suhannugul/capstoneai:${{ steps.meta.outputs.tag }}
