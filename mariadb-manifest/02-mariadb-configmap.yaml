# kubectl get -o yaml 로 2026-10-01 클러스터에서 추출 (status/uid/managedFields 등 런타임 필드 제거)
apiVersion: v1
data:
  primary.cnf: |
    [mysqld]
    # MariaDB 11.6+ 기본 ON. FK 부모 행 경합 시 1020 오류 → OFF (디버깅/2026-10-01-mariadb-snapshot-isolation-1020.md)
    innodb_snapshot_isolation=OFF
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=200
    innodb_buffer_pool_size=256M
    slow_query_log=1
    slow_query_log_file=/var/log/mysql/slow.log
    long_query_time=2
    log-bin=mysql-bin
    log-basename=primary

    [client]
    default-character-set=utf8mb4
  replica.cnf: |
    [mysqld]
    # MariaDB 11.6+ 기본 ON. FK 부모 행 경합 시 1020 오류 → OFF (디버깅/2026-10-01-mariadb-snapshot-isolation-1020.md)
    innodb_snapshot_isolation=OFF
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=200
    innodb_buffer_pool_size=256M
    slow_query_log=1
    slow_query_log_file=/var/log/mysql/slow.log
    long_query_time=2

    [client]
    default-character-set=utf8mb4
kind: ConfigMap
metadata:
  name: mariadb-config
  namespace: database
