# kubectl get -o yaml 로 2026-10-01 클러스터에서 추출 (status/uid/managedFields 등 런타임 필드 제거)
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: mariadb
  name: mariadb-pv-0
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 8Gi
  claimRef:
    name: mariadb-data-mariadb-0
    namespace: database
  nfs:
    path: /srv/nfs/share/mariadb-0
    server: 192.168.2.40
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: mariadb
  name: mariadb-pv-1
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 8Gi
  claimRef:
    name: mariadb-data-mariadb-1
    namespace: database
  nfs:
    path: /srv/nfs/share/mariadb-1
    server: 192.168.2.40
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
